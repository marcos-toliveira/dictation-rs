[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/marcos-toliveira/dictation-rs"
authors = ["marcos-toliveira"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
tracing = "0.1"
proptest = "1"

[profile.release]
lto = "thin"
strip = true
