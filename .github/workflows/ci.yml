name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System deps (Linux audio + tray + wayland)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libwayland-dev libxkbcommon-dev pkg-config
          sudo apt-get install -y libayatana-appindicator3-dev || \
          sudo apt-get install -y libappindicator3-dev
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (wayland examples)
        if: runner.os == 'Linux'
        run: cargo clippy -p dictation-ui --features wayland --examples -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build release
        run: cargo build --release --workspace
