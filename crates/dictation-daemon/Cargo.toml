[package]
name = "dictation-daemon"
description = "Daemon do dictation-rs: liga captura, ASR (Groq), correções e injeção num socket local."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dictation-core = { path = "../dictation-core" }
dictation-groq = { path = "../dictation-groq" }
dictation-platform = { path = "../dictation-platform", features = ["wayland"] }
dictation-ui = { path = "../dictation-ui" }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
arboard = "3"

[dev-dependencies]
dictation-core = { path = "../dictation-core" }
dictation-platform = { path = "../dictation-platform" }

