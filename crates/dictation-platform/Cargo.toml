[package]
name = "dictation-platform"
description = "Traits e implementações de plataforma: captura de áudio (cpal), injeção de texto (X11/xdotool), overlay e bandeja."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["audio-cpal", "x11"]
# captura de áudio portável (Linux ALSA/PulseAudio + Windows WASAPI)
audio-cpal = ["dep:cpal"]
# injeção/atalhos no X11 (via xdotool; XTest nativo vem depois)
x11 = []
# sessão Wayland (injeção via ydotool/wl-copy — fase F1 do port; layer-shell na UI)
wayland = []

[dependencies]
dictation-core = { path = "../dictation-core" }
thiserror = { workspace = true }
tracing = { workspace = true }
cpal = { version = "0.16", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
] }
arboard = "3"
