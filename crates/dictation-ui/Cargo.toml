[package]
name = "dictation-ui"
description = "Overlay REC + prévia ao vivo + bandeja do dictation-rs (egui/eframe; bandeja via ksni)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Sessão Wayland (overlay via layer-shell — fase F4 do port). X11 segue o padrão no Linux.
wayland = [
    "dep:smithay-client-toolkit",
    "dep:wayland-client",
    "dep:wayland-backend",
    "dep:wgpu",
    "dep:egui-wgpu",
    "dep:raw-window-handle",
    "dep:pollster",
]

[[example]]
name = "overlay_wayland_spike"
required-features = ["wayland"]

[[example]]
name = "overlay_wayland_egui"
required-features = ["wayland"]

[dependencies]
dictation-core = { path = "../dictation-core" }
dictation-platform = { path = "../dictation-platform", default-features = false }
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
serde = { workspace = true }
serde_json = "1"
tracing = { workspace = true }
smithay-client-toolkit = { version = "0.21", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-backend = { version = "0.3", optional = true, features = ["client_system"] }
wgpu = { version = "30", optional = true }
egui-wgpu = { version = "0.36", optional = true, default-features = false }
raw-window-handle = { version = "0.6", optional = true }
pollster = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
# Só para `EventLoopBuilderExtX11::with_x11` (overlay via XWayland em compositores sem
# layer-shell, ex.: GNOME). Mesma versão que o eframe resolve.
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Registry",
] }
raw-window-handle = "0.6"
