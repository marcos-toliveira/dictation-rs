[package]
name = "dictation-ui"
description = "Overlay REC + prévia ao vivo + bandeja do dictation-rs (egui/eframe; bandeja via ksni)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dictation-core = { path = "../dictation-core" }
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Registry",
] }
