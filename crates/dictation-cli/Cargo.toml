[package]
name = "dictation-cli"
description = "Cliente fino do dictation-rs: envia comandos ao daemon pelo socket."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dictation"
path = "src/main.rs"

[dependencies]
dictation-core = { path = "../dictation-core" }
dictation-groq = { path = "../dictation-groq" }
dictation-platform = { path = "../dictation-platform" }

[target.'cfg(target_os = "linux")'.dependencies]
# Injeção no Wayland (mesma seleção de backend do daemon).
dictation-platform = { path = "../dictation-platform", features = ["wayland"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = ["Win32_System_Pipes", "Win32_Foundation"] }
